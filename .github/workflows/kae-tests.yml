name: KAE tests

on:
  push:
    paths:
      - "kyro-anime-engine/**"
      - ".github/workflows/kae-tests.yml"
  pull_request:
    paths:
      - "kyro-anime-engine/**"
      - ".github/workflows/kae-tests.yml"

concurrency:
  group: kae-tests-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kyro-anime-engine
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: kyro-anime-engine/requirements.txt
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Run KAE Python regression suite
        env:
          PYTHONPATH: .
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check frontend module syntax
        run: find frontend/js -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Run camera controller regression tests
        run: node --test frontend/tests/*.test.js

  browser-smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kyro-anime-engine
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: kyro-anime-engine/requirements.txt
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright
        run: npm install --no-save playwright
        working-directory: kyro-anime-engine/frontend
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: kyro-anime-engine/frontend
      - name: Start KAE backend and wait for health
        env:
          PYTHONPATH: .
        run: |
          python run.py > /tmp/kae-browser-smoke.log 2>&1 &
          echo $! > /tmp/kae-browser-smoke.pid
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:5000/api/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/kae-browser-smoke.log
          exit 1
      - name: Run real-browser editor and rig smoke test
        run: node --test frontend/tests/browser_smoke.e2e.mjs
